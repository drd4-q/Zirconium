# The menu stays up for a few seconds; any key jumps straight through.  That is
# deliberate: when a machine cannot reach a usable video mode, this menu is the
# only way to pick "VGA text" instead of staring at a black screen, and it keeps
# early GRUB errors readable.
set timeout=5
set default=0

# Load the video driver set that matches the firmware.  Do NOT name individual
# backends here: grub-mkrescue ships vbe.mod/vga.mod only under i386-pc, so on
# a UEFI boot "insmod vbe" / "insmod vga" fail with
#   error: file `boot/grub/x86_64-efi/vbe.mod' not found.
# all_video resolves per platform instead (efi_gop/efi_uga on UEFI,
# vbe/vga/bochs/cirrus/vmware on BIOS), and this ISO keeps booting both ways.
insmod all_video
insmod gfxterm

# GRUB's OWN menu mode only - this is NOT the mode the kernel gets, see
# gfxpayload below.  Kept on an explicit list so the menu itself is predictable.
set gfxmode=1024x768x32,800x600x32,640x480x32

# NOTE ON ORDERING (do not move set gfxpayload above the multiboot line):
#   When a Multiboot header carries the VIDEO flag, grub's multiboot command
#   overwrites $gfxpayload with the header's mode request:
#       mode_type=0 + w,h,d  ->  "<w>x<h>x<d>,<w>x<h>,auto"
#   So a top-level "set gfxpayload=..." is dead code, and the generated
#   depth-less "<w>x<h>" entry can match a mode at a depth we do not want.
#   Setting gfxpayload AFTER "multiboot" (below) overrides the header request.
#
# The driver accepts 16 (RGB565), 24 and 32bpp LFBs, so every list below offers
# a depth-qualified chain and ends in "text" so the console stays reachable
# when no LFB exists at all.

menuentry "Zirconium OS (1024x768x32)" {
    multiboot /boot/kernel.bin
    set gfxpayload=1024x768x32,1024x768x24,1024x768x16,800x600x32,800x600x24,640x480x32,text
    boot
}

menuentry "Zirconium OS (native / high)" {
    multiboot /boot/kernel.bin
    set gfxpayload=1920x1080x32,1920x1080x24,1600x1200x32,1440x900x32,1366x768x32,1280x1024x32,1280x1024x24,1280x800x32,1152x864x32,1024x768x32,1024x768x16,800x600x32,640x480x32,text
    boot
}

menuentry "Zirconium OS (VGA text, safest)" {
    multiboot /boot/kernel.bin
    set gfxpayload=text
    boot
}
