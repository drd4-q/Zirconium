set timeout=2
set default=0

# Load video drivers for real GPUs (Intel, AMD, Nvidia, VESA, GOP)
insmod all_video
insmod gfxterm
insmod vbe
insmod vga

# Set preferred graphics resolution
set gfxmode=1024x768x32,800x600x32,auto
set gfxpayload=keep

menuentry "Zirconium OS (Graphics Mode)" {
    multiboot /boot/kernel.bin
    boot
}

menuentry "Zirconium OS (Text Mode Fallback)" {
    set gfxpayload=text
    multiboot /boot/kernel.bin
    boot
}
