# The menu stays up for a few seconds; any key jumps straight through.  That is
# deliberate: when a machine cannot reach a usable video mode, this menu is the
# only way to pick another entry instead of staring at a black screen.
set timeout=5
set default=0

# Load the video driver set that matches the firmware.  Do NOT name individual
# backends here: grub-mkrescue ships vbe.mod/vga.mod only under i386-pc, so on
# a UEFI boot "insmod vbe" / "insmod vga" fail with
#   error: file `boot/grub/x86_64-efi/vbe.mod' not found.
# all_video resolves per platform instead (efi_gop/efi_uga on UEFI,
# vbe/vga/bochs/cirrus/vmware on BIOS), and this ISO keeps booting both ways.
insmod all_video
insmod gfxterm

# GRUB's OWN menu mode.  This has a second, important job: it makes GRUB
# initialise a video adapter, which is what gives "gfxpayload=keep" something to
# keep.  Bootloaders that already run a graphical menu (Ventoy, systemd-boot,
# other GRUBs) hand us a live graphics mode; without an active adapter "keep"
# is a no-op and the kernel ends up with no LFB at all.
set gfxmode=auto,1024x768x32,1024x768x16,800x600x32,640x480x32
terminal_output gfxterm

# DEBUG HELPER (off by default).  Uncomment the four lines below when GRUB
# messages must be read from a COM port - a USB-TTL adapter on the board's
# serial header is enough, and `screen /dev/ttyUSB0 115200` (or minicom) on
# another machine reads both GRUB's errors and the whole kernel boot.  This is
# the only way to see what GRUB does when the display stays black.
#   insmod serial
#   serial --unit=0 --speed=115200
#   terminal_output serial console
#   terminal_input serial console

# WHY EVERY LIST ENDS IN "text" AND WHY ORDERING MATTERS:
#   The multiboot command overwrites $gfxpayload with the header's video
#   request, so a top-level "set gfxpayload=..." is dead code; setting it AFTER
#   "multiboot" is what actually takes effect.  "text" is the last resort so a
#   machine with no usable LFB still reaches the shell - but note that under
#   UEFI a "text" payload means the firmware console, so the kernel's VGA text
#   writes at 0xB8000 are NOT displayed and the screen looks black.  Prefer any
#   entry that hands the kernel a real framebuffer.
#
# The driver accepts 16 (RGB565), 24 and 32bpp LFBs.

menuentry "Zirconium OS (keep current mode)" {
    multiboot /boot/kernel.bin
    set gfxpayload=keep,text
    boot
}

menuentry "Zirconium OS (1024x768x32)" {
    multiboot /boot/kernel.bin
    set gfxpayload=1024x768x32,1024x768x24,1024x768x16,800x600x32,800x600x24,640x480x32,text
    boot
}

menuentry "Zirconium OS (native / high)" {
    multiboot /boot/kernel.bin
    set gfxpayload=1920x1080x32,1920x1080x24,1600x1200x32,1440x900x32,1366x768x32,1280x1024x32,1280x1024x24,1280x800x32,1152x864x32,1024x768x32,1024x768x16,800x600x32,640x480x32,text
    boot
}

menuentry "Zirconium OS (VGA text, Legacy only)" {
    multiboot /boot/kernel.bin
    set gfxpayload=text
    boot
}
