# Boot immediately by default; hold ESC/press a key to enter the menu.
set timeout=0
set default=0

# Load video drivers for real GPUs (Intel, AMD, Nvidia, VESA, GOP)
insmod all_video
insmod gfxterm
insmod vbe
insmod vga

# GRUB's OWN menu mode.  "auto" lets the video stack pick the panel-preferred
# mode (EDID preferred timing / flat-panel size / current GOP mode), and the
# explicit list keeps small adapters and QEMU deterministic.  This is NOT the
# mode the kernel gets: see gfxpayload below.
set gfxmode=auto,1024x768x32,800x600x32,640x480x32

# "keep" only has an effect when a video adapter is already active, so the
# graphical terminal must be selected explicitly (default is "console").
terminal_output gfxterm

# NOTE ON ORDERING (do not move set gfxpayload above the multiboot line):
#   When a Multiboot header carries the VIDEO flag, grub's multiboot command
#   overwrites $gfxpayload with the header's mode request:
#       mode_type=0 + w,h,d  ->  "<w>x<h>x<d>,<w>x<h>,auto"
#   So a top-level "set gfxpayload=..." is dead code, and the generated
#   depth-less "<w>x<h>" entry can match a 16bpp VBE mode that the kernel
#   framebuffer driver rejects (it needs 24/32bpp) -> invisible screen.
#   Setting gfxpayload AFTER "multiboot" (below) overrides the header request
#   and lets us ship only depth-qualified modes, each list ending in "text"
#   so the console stays visible when no usable LFB exists.

menuentry "Zirconium OS (1024x768x32)" {
    multiboot /boot/kernel.bin
    set gfxpayload=1024x768x32,800x600x32,640x480x32,text
    boot
}

menuentry "Zirconium OS (native / high)" {
    multiboot /boot/kernel.bin
    set gfxpayload=1920x1080x32,1600x1200x32,1440x900x32,1366x768x32,1280x1024x32,1280x800x32,1152x864x32,1024x768x32,800x600x32,640x480x32,keep,text
    boot
}

menuentry "Zirconium OS (Text Mode Fallback)" {
    multiboot /boot/kernel.bin
    set gfxpayload=text
    boot
}
