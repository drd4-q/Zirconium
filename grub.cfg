# The menu stays up for a few seconds; any key jumps straight through.  That is
# deliberate: when a machine cannot reach a usable video mode, this menu is the
# only way to pick another entry instead of staring at a black screen.
set timeout=5
set default=0

# Load the video driver set that matches the firmware.  Do NOT name individual
# backends here: grub-mkrescue ships vbe.mod/vga.mod only under i386-pc, so on
# a UEFI boot "insmod vbe" / "insmod vga" fail with
#   error: file `boot/grub/x86_64-efi/vbe.mod' not found.
# all_video resolves per platform instead (efi_gop/efi_uga on UEFI,
# vbe/vga/bochs/cirrus/vmware on BIOS), and this ISO keeps booting both ways.
insmod all_video
insmod gfxterm

# GRUB's OWN menu mode.  Deliberately an EXPLICIT list with a real resolution
# first and no "auto" in front: under UEFI "auto" makes GRUB ask GOP for the
# native mode and then, with "keep" in the payload chain, it hands the kernel a
# TEXT payload.  A text payload means the kernel gets no framebuffer at all
# (multiboot bit 12 clear), and under UEFI there is no VGA text console either -
# so the result is a completely black screen on hardware that used to work.
# Naming a concrete mode forces GRUB to call GOP SetMode, which re-trains the
# display link and leaves a real framebuffer to pass on.
set gfxmode=1024x768x32,800x600x32,640x480x32,1024x768x16
terminal_output gfxterm

# DEBUG HELPER (off by default).  Uncomment the four lines below when GRUB
# messages must be read from a COM port - a USB-TTL adapter on the board's
# serial header is enough, and `screen /dev/ttyUSB0 115200` (or minicom) on
# another machine reads both GRUB's errors and the whole kernel boot.  This is
# the only way to see what GRUB does when the display stays black.
#   insmod serial
#   serial --unit=0 --speed=115200
#   terminal_output serial console
#   terminal_input serial console

# WHY ORDERING MATTERS:
#   The multiboot command overwrites $gfxpayload with the header's video
#   request, so a top-level "set gfxpayload=..." is dead code; setting it AFTER
#   "multiboot" is what actually takes effect.
#
# WHY THE DEFAULT ENTRY HAS NO "text" IN ITS CHAIN:
#   "text" is a legal last resort on BIOS, but under UEFI it hands the kernel a
#   firmware text console instead of a framebuffer - multiboot bit 12 stays
#   clear, the driver stays in VGA text mode, and its writes to 0xB8000 are not
#   displayed by anything.  The screen is black with no error anywhere.  So the
#   default chain must contain graphics modes ONLY: if none of them can be set,
#   the kernel finds out and says so in the log instead of failing silently.
#
# The driver accepts 16 (RGB565), 24 and 32bpp LFBs.

# DEFAULT: force a concrete graphics mode so the kernel always receives a real
# framebuffer.  This is the configuration that worked before the "dynamic"
# gfxmode=auto / gfxpayload=keep change.
menuentry "Zirconium OS (1024x768x32, forced)" {
    set gfxmode=1024x768x32,800x600x32,640x480x32
    multiboot /boot/kernel.bin
    set gfxpayload=1024x768x32,800x600x32,640x480x32
    boot
}

menuentry "Zirconium OS (native / high, forced)" {
    multiboot /boot/kernel.bin
    set gfxpayload=1920x1080x32,1920x1080x24,1600x1200x32,1440x900x32,1366x768x32,1280x1024x32,1280x1024x24,1280x800x32,1152x864x32,1024x768x32,1024x768x16,800x600x32,640x480x32
    boot
}

# DIAGNOSTIC ONLY, not the default: "keep" relies on whatever mode the
# previous bootloader left behind.  Under UEFI that is usually a text payload,
# so expect a black screen and "[FB] No framebuffer info from bootloader".
menuentry "Zirconium OS (keep current mode - diagnostic)" {
    multiboot /boot/kernel.bin
    set gfxpayload=keep,text
    boot
}

# DIAGNOSTIC ONLY: 16bpp.  Real hardware with no 32bpp mode available lands
# here, and RGB565 is a different byte layout, so it is worth having one entry
# that asks for it explicitly.
menuentry "Zirconium OS (1024x768x16, diagnostic)" {
    set gfxmode=1024x768x16,800x600x16,640x480x16,1024x768x32,800x600x32
    multiboot /boot/kernel.bin
    set gfxpayload=1024x768x16,800x600x16,640x480x16
    boot
}

menuentry "Zirconium OS (VGA text, Legacy only)" {
    multiboot /boot/kernel.bin
    set gfxpayload=text
    boot
}
