set timeout=2
set default=0

# Load video drivers for real GPUs (Intel, AMD, Nvidia, VESA, GOP)
insmod all_video
insmod gfxterm
insmod vbe
insmod vga

# Set preferred graphics resolution. The chain ends with "text" so the
# console stays visible even when no 32bpp LFB is available (the kernel's
# framebuffer driver requires 32bpp and would otherwise draw invisibly).
set gfxmode=1024x768x32,800x600x32,640x480x32
set gfxpayload=1024x768x32,800x600x32,640x480x32,text

menuentry "Zirconium OS (Graphics Mode)" {
    multiboot /boot/kernel.bin
    boot
}

menuentry "Zirconium OS (Text Mode Fallback)" {
    set gfxpayload=text
    multiboot /boot/kernel.bin
    boot
}
