# Limine configuration for the Zirconium kernel.
#
# Limine replaces GRUB as the bootloader.  The kernel speaks the same
# Multiboot 1 protocol GRUB used to speak, so the boot contract between
# bootloader and kernel is unchanged: the kernel's `src/entry.S` still gets
# EAX = 0x2BADB002 and EBX = the Multiboot info block.
#
# Limine sets the video mode itself and hands the kernel a framebuffer
# through the Multiboot info block, so the `set gfxpayload=` ordering trap
# that GRUB had (and that `grub.cfg` documented at length) simply does not
# exist here: there is no payload chain to get wrong.

# Boot immediately.  The countdown is pure boot time: with `timeout: 3` the
# machine sat in the Limine menu for three seconds on every boot.  The menu
# is still available for debugging - `./build_iso.sh --menu-debug` builds an
# image whose timeout is `no`, and then every entry below is offered, so the
# video mode can be picked by hand.
timeout: 0

# Mirror the bootloader's own output to COM1 as well, so the serial log shows
# the menu and the handoff, not just the kernel's own messages.
serial: yes
serial_baudrate: 115200

# The kernel is a Multiboot 1 image (it has a Multiboot header in its first
# 8 KiB and is loaded at 1 MiB by the bootloader).
#
# `boot():` means "the volume/partition that holds this config file", so the
# same config works for the ISO (where the config sits at the root) and for a
# USB stick (where it sits at the root of the FAT partition).
protocol: multiboot1

# The video modes.
#
# GRUB had a *chain* of modes:
#
#     set gfxmode=1024x768x32,800x600x32,640x480x32
#     set gfxpayload=1024x768x32,800x600x32,640x480x32,text
#
# and the chain ended with "text", so the console stayed visible even when
# no 32bpp framebuffer was available.  Limine has no chain: one `resolution:`
# per entry.  So the alternatives are entries here, and the first one is
# what a normal boot uses; the menu (the `--menu-debug` build) offers them
# all.
#
# The text entry is the software rendering: the kernel paints the characters
# into the legacy VGA text buffer itself, no adapter needed.

/Zirconium 1024x768
protocol: multiboot1
path: boot():/boot/kernel.bin
resolution: 1024x768x32

/Zirconium 1920x1080
protocol: multiboot1
path: boot():/boot/kernel.bin
resolution: 1920x1080x32

/Zirconium 800x600
protocol: multiboot1
path: boot():/boot/kernel.bin
resolution: 800x600x32

/Zirconium text mode
protocol: multiboot1
path: boot():/boot/kernel.bin
textmode: yes
